# Cloud Run: este contenedor es el ingress (puerto 8080) y la API corre como sidecar en el mismo
# servicio/instancia, que comparte red: se alcanza en 127.0.0.1:3000 (no hay nombre "backend").
# Configuración local (compose.prod.yml) en docker/nginx.conf.

# Cloud Run termina TLS y envía X-Forwarded-Proto=https; se reenvía tal cual (o el esquema local si falta).
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    # Cloud Run ya registra cada petición (estado, latencia). El access log de nginx la duplicaría con
    # la IP del cliente y la URL completa, incluido el token de seguimiento.
    access_log off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Fotos de producción: hasta 8 MB en la API (+ margen del multipart).
    client_max_body_size 9m;

    # Cabeceras de seguridad no intrusivas (sin CSP de scripts). Referrer same-origin: las URLs de
    # seguimiento llevan el token y no deben viajar a otros sitios. nginx no hereda add_header en los
    # location que declaran los suyos, por eso se repiten abajo.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    location /api {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        # La API ya envía nosniff en las fotos; se evita duplicarlo.
        proxy_hide_header X-Content-Type-Options;
    }

    # Recursos con hash de Vite: inmutables.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # El service worker de Web Push debe revalidarse siempre.
    location = /sw.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location = /robots.txt {
        try_files $uri =404;
        log_not_found off;
        access_log off;
    }

    # SPA: index.html siempre revalidado para que un despliegue nuevo se vea de inmediato.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    }
}
