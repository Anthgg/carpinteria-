name: carpinteria

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-carpinteria}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-carpinteria_local}
      POSTGRES_DB: ${POSTGRES_DB:-carpinteria}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - carpinteria
    restart: unless-stopped

  backend:
    build:
      context: ../Bcarpinteria
      dockerfile: Dockerfile
      target: dev
    env_file:
      - path: ../Bcarpinteria/.env
        required: false
    environment:
      PORT: "3000"
      APP_ENV: ${APP_ENV:-LOCAL}
      NODE_ENV: development
      JWT_SECRET: ${JWT_SECRET:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://127.0.0.1:8080,http://localhost:8080,http://127.0.0.1:5173,http://localhost:5173}
      DATABASE_URL: postgresql://${POSTGRES_USER:-carpinteria}:${POSTGRES_PASSWORD:-carpinteria_local}@postgres:5432/${POSTGRES_DB:-carpinteria}?schema=public
      BD_PATH: /app/bd/inventario g.xlsx
      UPLOAD_DIR: /app/uploads
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://127.0.0.1:8080}
    volumes:
      - ../Bcarpinteria:/app
      - backend_node_modules:/app/node_modules
      - ../Bcarpinteria/bd:/app/bd:ro
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.status === 200 ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s
    networks:
      - carpinteria
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    environment:
      VITE_API_BASE: /api
      VITE_PROXY_TARGET: http://backend:3000
    ports:
      - "127.0.0.1:8080:5173"
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - carpinteria
    restart: unless-stopped

networks:
  carpinteria:
    name: carpinteria_net

volumes:
  pgdata:
    name: carpinteria_pgdata
  backend_node_modules:
    name: carpinteria_backend_node_modules
  frontend_node_modules:
    name: carpinteria_frontend_node_modules
  uploads:
    name: carpinteria_uploads
